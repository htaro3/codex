# Alternative scheduler for the PC watch
# Requires a Render account and approval for Render Cron Job charges.
# This file does not deploy anything by itself.
services:
  - type: cron
    name: mini-pc-deal-watch
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: "python3 -m compileall -q pc_watch"
    startCommand: "python3 pc_watch/watch.py"
    envVars:
      - key: GITHUB_REPOSITORY
        value: htaro3/codex
      - key: GITHUB_TOKEN
        sync: false
