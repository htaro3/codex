name: Mini PC scanner dry run
on:
  push:
    paths:
      - 'pc_watch/watch.py'
      - '.github/workflows/pc-watch-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner without issuing notifications
        run: |
          python3 -m unittest discover -s pc_watch -p 'test_*.py' -v
          python3 pc_watch/watch.py --dry-run
          python3 pc_watch/workflow_state.py
